<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord Badges Lookup</title>
  <style>
    .card { border: 1px solid #444; background: #222; color: #fff; padding: 20px; border-radius: 10px; width: 300px; }
  </style>
</head>
<body>

  <div class="card">
    <h3 id="username">جاري التحميل...</h3>
    <p id="user-id"></p>
    <p id="flags"></p>
  </div>

  <script>
    const userId = "1217944125555474565";

    // الاتصال بالـ Backend (سيرفر Express)
    fetch(`http://localhost:3000/api/user?id=${userId}`)
      .then(res => res.json())
      .then(data => {
        // طباعة البيانات داخل العناصر الرسومية
        document.getElementById('username').innerText = `@${data.username}`;
        document.getElementById('user-id').innerText = `ID: ${data.id}`;
        document.getElementById('flags').innerText = `Public Flags: ${data.public_flags}`;
      })
      .catch(err => {
        document.getElementById('username').innerText = "فشل جلب البيانات";
      });
  </script>

</body>
</html>
