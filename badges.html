<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Badges</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1f22;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #2b2d31;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 6px;
      border: 1px solid #383a40;
      background-color: #1e1f22;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #5865f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #4752c4;
    }
    #badgesResult {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .badge {
      background-color: #1e1f22;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Discord Badges</h2>
    <input type="text" id="userIdInput" placeholder="Enter Discord User ID">
    <button onclick="getBadges()">Check Badges</button>

    <div id="badgesResult"></div>
  </div>

  <script>
    async function getBadges() {
      const userId = document.getElementById('userIdInput').value.trim();
      const container = document.getElementById('badgesResult');

      if (!userId) return;

      container.innerHTML = 'Loading...';

      try {
        const res = await fetch(`/api/discord-badges?id=${userId}`);
        const data = await res.json();

        if (data.error) {
          container.innerHTML = data.error;
          return;
        }

        if (!data.badges || data.badges.length === 0) {
          container.innerHTML = 'No badges found.';
          return;
        }

        container.innerHTML = data.badges.map(badge => `
          <div class="badge">
            <img src="${badge.iconUrl}" alt="${badge.description}">
            <span>${badge.description}</span>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = 'Error loading badges.';
      }
    }
  </script>

</body>
</html>
