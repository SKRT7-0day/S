<script>
async function getBadges() {
  const userId = document.getElementById('userIdInput').value.trim();
  const container = document.getElementById('badgesResult');

  if (!userId) return;

  container.innerHTML = 'Loading...';

  try {
    const res = await fetch(`/api/discord-badges?id=${userId}`);
    const data = await res.json();

    if (data.error) {
      container.innerHTML = data.error;
      return;
    }

    if (!data.badges || data.badges.length === 0) {
      container.innerHTML = 'No badges found.';
      return;
    }

    container.innerHTML = data.badges.map(badge => `
      <div class="badge">
        <img src="${badge.iconUrl}" alt="${badge.description}">
        <span>${badge.description}</span>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = 'Error loading badges.';
  }
}
</script>
