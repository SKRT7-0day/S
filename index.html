  <script>

    function initParticleText() {
      const container = document.getElementById('particleTextName');
      const canvas = document.getElementById('particleTextCanvas');
      if (!container || !canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const text = 'SKRT7';
      const particleSize = 2.4;
      const density = 3;
      const color = '#f8fafc';
      const highlightColor = '#a855f7';
      const scatter = 100;
      const gatherDuration = 1100;
      const stagger = 220;
      const pointerRepel = 42;
      const repelRadius = 120;
      const idleDrift = 0.3;
      const fontWeight = 800;
      const fontFamily = window.getComputedStyle(container).fontFamily || 'sans-serif';

      function hexToRgb(hex) {
        const clean = hex.replace('#', '').trim();
        if (!/^[0-9a-fA-F]{6}$/.test(clean)) return null;
        return { r: parseInt(clean.slice(0, 2), 16), g: parseInt(clean.slice(2, 4), 16), b: parseInt(clean.slice(4, 6), 16) };
      }
      function mixRgb(from, to, amount) {
        return {
          r: Math.round(from.r + (to.r - from.r) * amount),
          g: Math.round(from.g + (to.g - from.g) * amount),
          b: Math.round(from.b + (to.b - from.b) * amount)
        };
      }
      function rgbToCss(rgb) { return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`; }
      function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      let particles = [];
      let animationFrame = null;
      let gathering = false;
      let gatherStart = 0;
      let reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
      let width = 0, height = 0, dpr = 1;

      const pointer = { active: false, x: 0, y: 0, smoothX: 0, smoothY: 0 };

      function startGather(fromScatter) {
        if (!particles.length) return;
        const now = performance.now();
        const spread = reducedMotion ? 0 : scatter;
        particles.forEach(p => {
          if (fromScatter) {
            const angle = p.seed * Math.PI * 2;
            const distance = spread * (0.35 + p.depth * 0.75);
            p.x = p.targetX + Math.cos(angle) * distance + (p.depth - 0.5) * spread * 0.55;
            p.y = p.targetY + Math.sin(angle) * distance + (p.seed - 0.5) * spread * 0.55;
          }
          p.startX = p.x;
          p.startY = p.y;
          p.delay = reducedMotion ? 0 : p.seed * stagger;
        });
        gatherStart = now;
        gathering = true;
      }

      function drawParticle(p) {
        const size = p.size;
        ctx.fillStyle = p.color;
        if (size <= 2.1) {
          ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
          return;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, size / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      function render(now) {
        ctx.clearRect(0, 0, width, height);
        ctx.shadowBlur = reducedMotion ? 0 : particleSize * 3;
        ctx.shadowColor = highlightColor;

        pointer.smoothX += (pointer.x - pointer.smoothX) * 0.18;
        pointer.smoothY += (pointer.y - pointer.smoothY) * 0.18;

        let complete = true;
        particles.forEach(p => {
          let baseX = p.targetX, baseY = p.targetY, progress = 1;

          if (gathering) {
            const local = (now - gatherStart - p.delay) / Math.max(1, reducedMotion ? 1 : gatherDuration);
            progress = clamp(local, 0, 1);
            const eased = easeOutCubic(progress);
            baseX = p.startX + (p.targetX - p.startX) * eased;
            baseY = p.startY + (p.targetY - p.startY) * eased;
            if (progress < 1) complete = false;
          } else if (!reducedMotion && idleDrift > 0) {
            const dt = now * 0.001;
            baseX += Math.sin(dt * 0.9 + p.seed * 10) * idleDrift * p.depth;
            baseY += Math.cos(dt * 0.75 + p.depth * 10) * idleDrift * p.depth;
          }

          if (pointer.active && !reducedMotion) {
            const dx = baseX - pointer.smoothX, dy = baseY - pointer.smoothY;
            const dist = Math.hypot(dx, dy);
            if (dist > 0 && dist < repelRadius) {
              const force = Math.pow(1 - dist / repelRadius, 2) * pointerRepel;
              baseX += (dx / dist) * force;
              baseY += (dy / dist) * force;
            }
          }

          const follow = reducedMotion ? 1 : 0.22;
          p.x += (baseX - p.x) * follow;
          p.y += (baseY - p.y) * follow;

          ctx.globalAlpha = clamp(0.35 + progress * 0.65, 0, 1);
          drawParticle(p);
        });

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        if (gathering && complete) gathering = false;
        animationFrame = requestAnimationFrame(render);
      }

      function ensureRenderLoop() {
        if (animationFrame === null) animationFrame = requestAnimationFrame(render);
      }

      function sampleText() {
        const rect = container.getBoundingClientRect();
        width = Math.floor(rect.width);
        height = Math.floor(rect.height);
        if (width <= 0 || height <= 0) return;

        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(width * dpr));
        canvas.height = Math.max(1, Math.floor(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        let resolvedSize = Math.min(Math.max(width * 0.24, 60), 140);
        let font = `${fontWeight} ${resolvedSize}px ${fontFamily}`;

        const offscreen = document.createElement('canvas');
        const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
        if (!offCtx) return;

        const maxTextWidth = width * 0.92;
        offCtx.font = font;
        let metrics = offCtx.measureText(text);
        let measuredWidth = Math.max(1, metrics.width);
        if (measuredWidth > maxTextWidth) {
          resolvedSize = Math.max(18, resolvedSize * (maxTextWidth / measuredWidth));
          font = `${fontWeight} ${resolvedSize}px ${fontFamily}`;
          offCtx.font = font;
          metrics = offCtx.measureText(text);
        }

        const left = Math.ceil(metrics.actualBoundingBoxLeft || 0);
        const right = Math.ceil(metrics.actualBoundingBoxRight || metrics.width);
        const ascent = Math.ceil(metrics.actualBoundingBoxAscent || resolvedSize * 0.78);
        const descent = Math.ceil(metrics.actualBoundingBoxDescent || resolvedSize * 0.22);
        const padding = Math.max(12, Math.ceil(resolvedSize * 0.08));
        const textWidth = Math.max(1, left + right);
        const textHeight = Math.max(1, ascent + descent);

        offscreen.width = textWidth + padding * 2;
        offscreen.height = textHeight + padding * 2;
        offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
        offCtx.font = font;
        offCtx.textAlign = 'left';
        offCtx.textBaseline = 'alphabetic';
        offCtx.fillStyle = '#ffffff';
        offCtx.fillText(text, padding - left, padding + ascent);

        const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
        const targets = [];
        const step = Math.max(2, Math.floor(density));

        for (let y = 0; y < offscreen.height; y += step) {
          for (let x = 0; x < offscreen.width; x += step) {
            const alpha = imageData.data[(y * offscreen.width + x) * 4 + 3];
            if (alpha > 40) {
              targets.push({
                x: width / 2 - offscreen.width / 2 + x,
                y: height / 2 - offscreen.height / 2 + y,
                alpha: alpha / 255
              });
            }
          }
        }

        const maxParticles = Math.max(900, Math.min(5200, Math.floor((width * height) / 90)));
        const stride = Math.max(1, Math.ceil(targets.length / maxParticles));
        const baseRgb = hexToRgb(color);
        const highlightRgb = hexToRgb(highlightColor);
        const selected = targets.filter((_, index) => index % stride === 0);

        particles = selected.map((target, index) => {
          const seed = ((index * 9301 + 49297) % 233280) / 233280;
          const depth = 0.45 + (((index * 233 + 97) % 1000) / 1000) * 0.9;
          const blend = baseRgb && highlightRgb ? clamp(target.x / Math.max(1, width) + (seed - 0.5) * 0.35, 0, 1) : 0;
          const particleColor = baseRgb && highlightRgb ? rgbToCss(mixRgb(baseRgb, highlightRgb, blend)) : color;
          const angle = seed * Math.PI * 2;
          const distance = (reducedMotion ? 0 : scatter) * (0.35 + depth * 0.75);
          const startX = target.x + Math.cos(angle) * distance + (seed - 0.5) * scatter * 0.45;
          const startY = target.y + Math.sin(angle) * distance + (depth - 0.9) * scatter * 0.45;

          return {
            x: reducedMotion ? target.x : startX,
            y: reducedMotion ? target.y : startY,
            startX, startY,
            targetX: target.x, targetY: target.y,
            size: Math.max(0.6, particleSize * (0.75 + target.alpha * 0.45)),
            color: particleColor,
            seed, depth,
            delay: seed * stagger
          };
        });

        pointer.x = width / 2;
        pointer.y = height / 2;
        pointer.smoothX = pointer.x;
        pointer.smoothY = pointer.y;

        if (reducedMotion) {
          particles.forEach(p => {
            p.x = p.targetX; p.y = p.targetY;
            p.startX = p.targetX; p.startY = p.targetY;
            p.delay = 0;
          });
          gathering = false;
        } else {
          startGather(false);
        }

        ensureRenderLoop();
      }

      let resizeFrame = null;
      function queueSample() {
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(sampleText);
      }

      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        pointer.active = true;
      });
      canvas.addEventListener('pointerleave', () => { pointer.active = false; });
      canvas.addEventListener('click', () => startGather(true));

      if (window.ResizeObserver) {
        const resizeObserver = new ResizeObserver(queueSample);
        resizeObserver.observe(container);
      } else {
        window.addEventListener('resize', queueSample);
      }

      sampleText();
    }

    function formatClock(ms) {
      if (!isFinite(ms) || ms < 0) ms = 0;
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) {
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function tickSpotifyProgress() {
      if (!activityTickerData) return;

      const elapsed = Math.min(Math.max(now - start, 0), end - start);

      document.getElementById('activityProgressFill').style.width = pct + '%';

    function getGameImageUrl(activity) {
      const large = activity.assets && activity.assets.large_image;
      if (!large) return null;
      if (large.startsWith('mp:')) {

    }

    let lastDynamicBgUrl = null;
    const dynamicColorCache = new Map();

    function extractDominantColor(imgUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const size = 32;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, size, size);
            const { data } = ctx.getImageData(0, 0, size, size);

            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
              const alpha = data[i + 3];
              if (alpha < 128) continue;
              r += data[i];
              g += data[i + 1];
              b += data[i + 2];
              count++;
            }
            if (count === 0) return reject(new Error('No opaque pixels'));
            resolve([Math.round(r / count), Math.round(g / count), Math.round(b / count)]);
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = imgUrl;
      });
    }

    let activeBgLayer = 'A';

    async function applyDynamicBackground(imgUrl) {
      if (!imgUrl || imgUrl === lastDynamicBgUrl) return;
      lastDynamicBgUrl = imgUrl;

      const card = document.getElementById('activityCard');
      card.style.setProperty('--art-bg-echo', `url("${imgUrl}")`);

      const showing = document.getElementById(activeBgLayer === 'A' ? 'dynamicBgA' : 'dynamicBgB');
      const hidden = document.getElementById(activeBgLayer === 'A' ? 'dynamicBgB' : 'dynamicBgA');

      hidden.style.backgroundImage = `url("${imgUrl}")`;
      hidden.classList.add('active');
      showing.classList.remove('active');
      activeBgLayer = activeBgLayer === 'A' ? 'B' : 'A';

      try {
        let rgb = dynamicColorCache.get(imgUrl);
        if (!rgb) {
          rgb = await extractDominantColor(imgUrl);
          dynamicColorCache.set(imgUrl, rgb);
        }
        if (lastDynamicBgUrl !== imgUrl) return;

        const [r, g, b] = rgb;
        const tint = document.getElementById('dynamicBgTint');
        tint.style.setProperty('--dynamic-tint', `rgba(${r}, ${g}, ${b}, 0.28)`);
        tint.classList.add('active');

        card.style.setProperty('--art-glow', `rgba(${r}, ${g}, ${b}, 0.55)`);
        card.style.setProperty('--card-tint', `rgba(${r}, ${g}, ${b}, 0.22)`);
        card.style.setProperty('--card-ring', `rgba(${r}, ${g}, ${b}, 0.35)`);
      } catch (err) {

        console.warn('Dynamic background color extraction failed:', err);
      }
    }

    function clearDynamicBackground() {
      lastDynamicBgUrl = null;
      document.getElementById('dynamicBgA').classList.remove('active');

    }

    let currentEmbedTrackId = null;

    function updateSpotifyEmbed(trackId) {
      const wrap = document.getElementById('spotifyEmbedWrap');
      const frame = document.getElementById('spotifyEmbedFrame');
      if (!trackId) {
        wrap.style.display = 'none';
        return;
      }
      if (trackId !== currentEmbedTrackId) {
        currentEmbedTrackId = trackId;
        frame.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0`;
      }
      wrap.style.display = 'block';
    }

    function resetSpotifyEmbed() {
      currentEmbedTrackId = null;
      const wrap = document.getElementById('spotifyEmbedWrap');
      const frame = document.getElementById('spotifyEmbedFrame');
      wrap.style.display = 'none';
      frame.src = '';
    }

    function resetLyrics() {
      currentLyricsLines = null;
      currentLyricsKey = null;
      currentActiveLyricIndex = -1;
      const panel = document.getElementById('lyricsPanel');
      panel.style.display = 'none';
      panel.innerHTML = '';
    }

    function parseLRC(lrcText) {
      const lines = [];
      lrcText.split('\n').forEach(line => {
        const match = line.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
        if (!match) return;
        const minutes = parseInt(match[1], 10);
        const seconds = parseFloat(match[2]);
        const text = match[3].trim();
        if (text) {
          lines.push({ time: (minutes * 60 + seconds) * 1000, text });
        }
      });
      return lines.sort((a, b) => a.time - b.time);
    }

    function renderLyrics(lines) {
      const panel = document.getElementById('lyricsPanel');
      if (!lines || lines.length === 0) {
        panel.innerHTML = '<div class="lyrics-unavailable">No synced lyrics found for this track.</div>';
        panel.style.display = 'block';
        return;
      }
      const track = document.createElement('div');
      track.className = 'lyrics-track';
      track.id = 'lyricsTrack';
      lines.forEach((line, i) => {
        const el = document.createElement('div');
        el.className = 'lyrics-line';
        el.textContent = line.text;
        el.dataset.index = i;
        track.appendChild(el);
      });
      panel.innerHTML = '';
      panel.appendChild(track);
      panel.style.display = 'block';
    }

    function syncLyrics(elapsedMs) {
      if (!currentLyricsLines || currentLyricsLines.length === 0) return;

      let activeIndex = -1;
      for (let i = 0; i < currentLyricsLines.length; i++) {
        if (currentLyricsLines[i].time <= elapsedMs) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex === currentActiveLyricIndex) return;
      currentActiveLyricIndex = activeIndex;

      const track = document.getElementById('lyricsTrack');
      if (!track) return;

      track.querySelectorAll('.lyrics-line').forEach(el => el.classList.remove('active'));
      if (activeIndex >= 0) {
        const activeEl = track.querySelector(`[data-index="${activeIndex}"]`);
        if (activeEl) {
          activeEl.classList.add('active');

          const panel = document.getElementById('lyricsPanel');
          const offset = activeEl.offsetTop - (panel.clientHeight / 2) + (activeEl.clientHeight / 2);
          track.style.transform = `translateY(${-offset}px)`;
        }
      }
    }

    async function maybeFetchLyrics(song, artist, durationSec) {
      if (!song || !artist) {
        resetLyrics();
        return;
      }
      const key = `${artist}::${song}`;
      if (key === currentLyricsKey) return;
      currentLyricsKey = key;
      currentLyricsLines = null;
      currentActiveLyricIndex = -1;

      const panel = document.getElementById('lyricsPanel');
      panel.innerHTML = '<div class="lyrics-unavailable">Loading lyrics…</div>';
      panel.style.display = 'block';

      try {
        const params = new URLSearchParams({
          track_name: song,
          artist_name: artist,
        });
        if (durationSec) params.set('duration', durationSec);

        const res = await fetch(`https://lrclib.net/api/get?${params.toString()}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();

        if (key !== currentLyricsKey) return;

        if (data.syncedLyrics) {
          currentLyricsLines = parseLRC(data.syncedLyrics);
          renderLyrics(currentLyricsLines);
        } else {
          renderLyrics(null);
        }
      } catch (err) {
        if (key === currentLyricsKey) {
          renderLyrics(null);
        }
      }
    }

    function updateActivityCard(data) {
      if (data.listening_to_spotify && data.spotify) {
        showSpotifyCard(data.spotify);
        return;
      }
      const gameActivity = (data.activities || []).find(a => a.type === 0);
      if (gameActivity) {
        showGameCard(gameActivity);
        return;
      }
      hideActivityCard();
    }

    async function updateDiscordPresence() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);

        if (!res.ok) return;

        const json = await res.json();

        if (!json.success) return;

        const data = json.data;
        const user = data.discord_user;

        const avatarImg = document.getElementById('discordAvatar');
        if (user && user.avatar) {
          const isAnimatedAvatar = user.avatar.startsWith('a_');
          const avatarExt = isAnimatedAvatar ? 'gif' : 'png';
          avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${avatarExt}?size=256`;
          avatarImg.style.display = 'block';
        } else {
          avatarImg.style.display = 'block';
        }

        if (user && user.accent_color) {
          const accentColor = '#' + user.accent_color.toString(16).padStart(6, '0').toUpperCase();

          const r = parseInt(accentColor.slice(1, 3), 16);
          const g = parseInt(accentColor.slice(3, 5), 16);
          const b = parseInt(accentColor.slice(5, 7), 16);

          const lighterColor = `rgb(${Math.min(r + 50, 255)}, ${Math.min(g + 50, 255)}, ${Math.min(b + 50, 255)})`;
          const darkerColor = `rgb(${Math.max(r - 50, 0)}, ${Math.max(g - 50, 0)}, ${Math.max(b - 50, 0)})`;

          const gradient = `linear-gradient(45deg, ${accentColor}, ${lighterColor}, ${accentColor}, ${darkerColor}, ${accentColor})`;

          document.documentElement.style.setProperty('--gradient-color', gradient);
        }

        const decoEl = document.getElementById('avatarDecoration');
        if (user && user.avatar_decoration_data && user.avatar_decoration_data.asset) {
          const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png?size=256`;
          decoEl.src = decoUrl;
          decoEl.style.display = 'block';
          decoEl.style.visibility = 'visible';
        } else {
          decoEl.style.display = 'none';
          decoEl.style.visibility = 'hidden';
        }

        const statusDot = document.getElementById('statusDot');
        const status = data.discord_status || 'offline';

        statusDot.classList.remove('status-online', 'status-idle', 'status-dnd', 'status-offline');

        statusDot.classList.add('status-' + status);

        const statusLabels = {
          'online': '🟢 Online',
          'idle': '🌙 Idle (Away)',
          'dnd': '🔴 Do Not Disturb',
          'offline': '⚫ Offline'
        };
        statusDot.title = statusLabels[status] || 'Unknown';

        const customStatusEl = document.getElementById('discordCustomStatus');
        let customStatusText = '';

        if (data.activities && data.activities.length > 0) {
          const customStatus = data.activities.find(a => a.type === 4);
          if (customStatus && customStatus.state) {
            customStatusText = customStatus.state;
            if (customStatus.emoji) {
              if (customStatus.emoji.id) {
                const ext = customStatus.emoji.animated ? 'gif' : 'png';
                const altExt = customStatus.emoji.animated ? 'png' : 'gif';
                const emojiId = customStatus.emoji.id;
                const emojiStr = `<img src="https://cdn.discordapp.com/emojis/${emojiId}.${ext}" data-alt="https://cdn.discordapp.com/emojis/${emojiId}.${altExt}" data-tried="0" style="width:18px;height:18px;margin-right:4px;vertical-align:middle;" alt="" onerror="if(this.dataset.tried==='0'){this.dataset.tried='1';this.src=this.dataset.alt;}else{this.style.display='none';}">`;
                customStatusText = emojiStr + customStatusText;
              } else if (customStatus.emoji.name) {
                customStatusText = customStatus.emoji.name + ' ' + customStatusText;
              }
            }
          }
        }

        customStatusEl.innerHTML = customStatusText ? customStatusText : '';

        const container = document.getElementById('customStatusContainer');
        if (customStatusText) {
          container.style.opacity = '1';
          container.style.visibility = 'visible';
        } else {
          container.style.opacity = '0.6';
          container.style.visibility = 'visible';
        }

        updateActivityCard(data);

      } catch (err) {
        console.error('Lanyard fetch failed:', err);
      }
    }

    updateDiscordPresence();
    setInterval(updateDiscordPresence, 5000);

    const GITHUB_USERNAME = 'SKRT7-0day';

    fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=pushed&per_page=1`)
      .then(res => res.json())
      .then(repos => {
        const el = document.getElementById('nowLineText');
        if (!el) return;
        if (Array.isArray(repos) && repos.length > 0) {
          const repo = repos[0];
          el.innerHTML = `latest project: <a href="${repo.html_url}" target="_blank">${repo.name}</a>`;
        } else {
          el.textContent = 'no public projects yet';
        }
      })
      .catch(err => {
        console.warn('GitHub now-line fetch failed:', err);
        const el = document.getElementById('nowLineText');
        if (el) el.textContent = 'latest project: unavailable';
      });

    function animateCountUp(el, target, duration) {
      const start = 0;
      const startTime = performance.now();
      function tick(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (target - start) * eased);
        el.textContent = current.toLocaleString();
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = target.toLocaleString();
        }
      }
      requestAnimationFrame(tick);
    }

    const VISIT_COUNTER_KEY = 'skrt7-workers-dev-visits';
    const VISIT_LOCAL_FLAG = 'skrt7_visit_counted';
    const alreadyCounted = localStorage.getItem(VISIT_LOCAL_FLAG) === '1';
    const counterEndpoint = alreadyCounted
      ? `https://countapi.mileshilliard.com/api/v1/get/${VISIT_COUNTER_KEY}`
      : `https://countapi.mileshilliard.com/api/v1/hit/${VISIT_COUNTER_KEY}`;

    fetch(counterEndpoint)
      .then(res => res.json())
      .then(data => {
        const el = document.getElementById('visitorCount');
        if (el && data && typeof data.value !== 'undefined') {
          if (!alreadyCounted) {
            localStorage.setItem(VISIT_LOCAL_FLAG, '1');
          }
          const target = data.value;
          const duration = Math.min(400 + target * 15, 1800);
          animateCountUp(el, target, duration);
        }
      })
      .catch(err => {
        console.warn('Visitor counter unavailable:', err);
        const el = document.getElementById('visitorCount');
        if (el) el.textContent = '—';
      });

    const RATING_SUM_KEY = 'skrt7-workers-dev-rating-sum';
    const RATING_COUNT_KEY = 'skrt7-workers-dev-rating-count';
    const RATING_LOCAL_FLAG = 'skrt7_rating_value';
    const RATING_BASE = 'https://countapi.mileshilliard.com/api/v1';

    const ratingWidget = document.getElementById('ratingWidget');
    const ratingStars = document.querySelectorAll('.rating-star');
    const ratingAverageEl = document.getElementById('ratingAverage');
    const ratingCountEl = document.getElementById('ratingCount');

    function paintStars(filledCount) {
      ratingStars.forEach(star => {
        const val = parseInt(star.dataset.value, 10);
        star.classList.toggle('filled', val <= filledCount);
      });
    }

    function refreshRatingDisplay() {
      Promise.all([
        fetch(`${RATING_BASE}/get/${RATING_SUM_KEY}`).then(r => r.json()).catch(() => null),
        fetch(`${RATING_BASE}/get/${RATING_COUNT_KEY}`).then(r => r.json()).catch(() => null),
      ]).then(([sumData, countData]) => {
        const sum = sumData && sumData.value ? Number(sumData.value) : 0;
        const count = countData && countData.value ? Number(countData.value) : 0;
        const avg = count > 0 ? sum / count : 0;
        ratingAverageEl.textContent = count > 0 ? avg.toFixed(2) : '—';
        ratingCountEl.textContent = count;
        if (!localStorage.getItem(RATING_LOCAL_FLAG)) {
          paintStars(Math.round(avg));
        }
      });
    }

    const myRating = localStorage.getItem(RATING_LOCAL_FLAG);
    if (myRating) {
      ratingWidget.classList.add('rated');
    }

    ratingStars.forEach(star => {
      star.addEventListener('mouseenter', () => {
        if (localStorage.getItem(RATING_LOCAL_FLAG)) return;
        const val = parseInt(star.dataset.value, 10);
        ratingStars.forEach(s => s.classList.toggle('hovered', parseInt(s.dataset.value, 10) <= val));
      });
      star.addEventListener('mouseleave', () => {
        ratingStars.forEach(s => s.classList.remove('hovered'));
      });
      star.addEventListener('click', () => {
        if (localStorage.getItem(RATING_LOCAL_FLAG)) return;
        const val = parseInt(star.dataset.value, 10);
        localStorage.setItem(RATING_LOCAL_FLAG, String(val));
        ratingWidget.classList.add('rated');
        paintStars(val);

        Promise.all([
          fetch(`${RATING_BASE}/get/${RATING_SUM_KEY}`).then(r => r.json()).catch(() => ({ value: 0 })),
          fetch(`${RATING_BASE}/get/${RATING_COUNT_KEY}`).then(r => r.json()).catch(() => ({ value: 0 })),
        ]).then(([sumData, countData]) => {
          const newSum = (sumData && sumData.value ? Number(sumData.value) : 0) + val;
          const newCount = (countData && countData.value ? Number(countData.value) : 0) + 1;
          return Promise.all([
            fetch(`${RATING_BASE}/set/${RATING_SUM_KEY}?value=${newSum}`),
            fetch(`${RATING_BASE}/set/${RATING_COUNT_KEY}?value=${newCount}`),
          ]);
        }).then(() => refreshRatingDisplay());
      });
    });

    refreshRatingDisplay();

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function updateTimeProgress() {
      const now = new Date();
      const year = now.getFullYear();

      const yearStart = new Date(year, 0, 1);
      const yearEnd = new Date(year + 1, 0, 1);
      const yearPct = ((now - yearStart) / (yearEnd - yearStart)) * 100;

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const dateStr = `${MONTH_NAMES[now.getMonth()]} ${now.getDate()}, ${hh}:${mm}`;

      document.getElementById('tpSubtext').textContent = dateStr;
      document.getElementById('tpFill').style.width = yearPct.toFixed(2) + '%';
      animateYearHeading(yearPct, year, 1300);
    }

    let lastDisplayedYearPct = 0;

    function animateYearHeading(target, year, duration) {
      const headingEl = document.getElementById('tpHeading');
      const from = lastDisplayedYearPct;
      const start = performance.now();
      function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const current = from + (target - from) * eased;
        headingEl.textContent = `${current.toFixed(0)}% of ${year} has passed`;
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          headingEl.textContent = `${target.toFixed(0)}% of ${year} has passed`;
          lastDisplayedYearPct = target;
        }
      }
      requestAnimationFrame(tick);
    }

    function initTimeProgress() {
      const now = new Date();
      const year = now.getFullYear();
      const yearStart = new Date(year, 0, 1);
      const yearEnd = new Date(year + 1, 0, 1);
      const yearPct = ((now - yearStart) / (yearEnd - yearStart)) * 100;

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const dateStr = `${MONTH_NAMES[now.getMonth()]} ${now.getDate()}, ${hh}:${mm}`;

      const fillEl = document.getElementById('tpFill');
      document.getElementById('tpSubtext').textContent = dateStr;

      const ANIM_DURATION = 1300;

      fillEl.style.width = '0%';

      void fillEl.offsetWidth;
      requestAnimationFrame(() => {
        fillEl.style.width = yearPct.toFixed(2) + '%';
      });

      animateYearHeading(yearPct, year, ANIM_DURATION);
    }

    setInterval(updateTimeProgress, 60000);

    (function() {
      const AURA_KEY = 'skrt7_aura_theme';
      const btn = document.getElementById('auraPickerBtn');
      const panel = document.getElementById('auraPickerPanel');
      const container = document.getElementById('auraBgContainer');
      const options = document.querySelectorAll('.aura-option');
      const themeClasses = ['aura-golden', 'aura-aqua', 'aura-dots', 'aura-neon'];

      function applyAuraTheme(theme) {
        themeClasses.forEach(c => container.classList.remove(c));
        container.classList.remove('aura-active');
        if (theme && theme !== 'default') {
          container.classList.add('aura-' + theme);
          container.classList.add('aura-active');
        }
        options.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === theme));
      }

      const saved = localStorage.getItem(AURA_KEY) || 'default';
      applyAuraTheme(saved);

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
          panel.classList.remove('open');
        }
      });

      options.forEach(opt => {
        opt.addEventListener('click', () => {
          const theme = opt.dataset.theme;
          applyAuraTheme(theme);
          localStorage.setItem(AURA_KEY, theme);
          panel.classList.remove('open');
        });
      });
    })();
  </script>

  <script src="oneko.js"></script>
</body>
